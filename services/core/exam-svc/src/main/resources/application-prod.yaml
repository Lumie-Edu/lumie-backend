spring:
  datasource:
    url: jdbc:postgresql://lumie-db-rw.lumie-db.svc:5432/lumie?prepareThreshold=0
  rabbitmq:
    host: rabbitmq.lumie-event.svc
    port: 5672
  jpa:
    show-sql: false

minio:
  endpoint: http://minio.minio.svc:9000

grpc:
  client:
    tenant-svc:
      address: static://tenant-svc-grpc.lumie-tenant.svc:9090
    billing-svc:
      address: static://billing-svc-grpc.lumie-billing.svc:9090
    academy-svc:
      address: static://academy-svc-grpc.lumie-academy.svc:9090

lumie:
  services:
    grading:
      url: http://grading-svc.lumie-worker.svc:8000

logging:
  level:
    root: WARN
    com.lumie: INFO
    org.hibernate.SQL: WARN

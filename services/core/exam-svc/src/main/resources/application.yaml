spring:
  application:
    name: exam-svc

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumie}?prepareThreshold=0
    username: ${DB_USERNAME:lumie}
    password: ${DB_PASSWORD:lumie}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        multiTenancy: SCHEMA
    open-in-view: false

  flyway:
    enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 500MB
      file-size-threshold: 5MB

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:lumie-files}

grpc:
  server:
    port: 9090
  client:
    tenant-svc:
      address: static://${TENANT_SVC_GRPC_HOST:localhost}:9090
      negotiation-type: plaintext
    billing-svc:
      address: static://${BILLING_SVC_GRPC_HOST:localhost}:9090
      negotiation-type: plaintext
    academy-svc:
      address: static://${ACADEMY_SVC_GRPC_HOST:localhost}:9090
      negotiation-type: plaintext

server:
  port: 8080
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# External Services
lumie:
  services:
    grading:
      url: ${GRADING_SVC_URL:http://localhost:8001}
    report:
      url: ${REPORT_SVC_URL:http://localhost:8002}

logging:
  level:
    root: INFO
    com.lumie: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

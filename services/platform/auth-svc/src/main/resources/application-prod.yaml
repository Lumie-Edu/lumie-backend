spring:
  datasource:
    url: jdbc:postgresql://lumie-db-rw.lumie-db.svc:5432/lumie?prepareThreshold=0
  data:
    redis:
      sentinel:
        nodes: redis.lumie-cache.svc:26379
  jpa:
    show-sql: false

grpc:
  client:
    tenant-svc:
      address: static://tenant-svc-grpc.lumie-tenant.svc:9090

logging:
  level:
    root: WARN
    com.lumie: INFO
    io.jsonwebtoken: WARN

syntax = "proto3";

package lumie;

option java_multiple_files = true;
option java_package = "com.lumie.grpc.admin";
option java_outer_classname = "AdminProto";

service AdminService {
  rpc GetAdmin(GetAdminRequest) returns (AdminResponse);
  rpc GetAdminByUserId(GetAdminByUserIdRequest) returns (AdminResponse);
  rpc ValidateAdmin(ValidateAdminRequest) returns (ValidateAdminResponse);
  rpc GetAdminPermissions(GetAdminPermissionsRequest) returns (AdminPermissionsResponse);
  rpc GetAdminsByAcademy(GetAdminsByAcademyRequest) returns (AdminListResponse);
}

message GetAdminRequest {
  string tenant_slug = 1;
  int64 admin_id = 2;
}

message GetAdminByUserIdRequest {
  string tenant_slug = 1;
  int64 user_id = 2;
}

message AdminResponse {
  int64 id = 1;
  int64 user_id = 2;
  string user_login_id = 3;
  string name = 4;
  string phone = 5;
  string email = 6;
  int64 position_id = 7;
  string position_name = 8;
  bool is_active = 9;
  string employment_status = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ValidateAdminRequest {
  string tenant_slug = 1;
  int64 admin_id = 2;
}

message ValidateAdminResponse {
  bool valid = 1;
  string message = 2;
  int64 admin_id = 3;
}

message GetAdminPermissionsRequest {
  string tenant_slug = 1;
  int64 admin_id = 2;
}

message AdminPermissionsResponse {
  int64 admin_id = 1;
  repeated PermissionEntry permissions = 2;
}

message PermissionEntry {
  string permission_code = 1;
  string access_level = 2;
}

message GetAdminsByAcademyRequest {
  string tenant_slug = 1;
  int64 academy_id = 2;
  int32 page = 3;
  int32 size = 4;
}

message AdminListResponse {
  repeated AdminResponse admins = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 size = 4;
}

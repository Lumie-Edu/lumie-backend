spring:
  application:
    name: lumie-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumie}?prepareThreshold=0
    username: ${DB_USERNAME:lumie}
    password: ${DB_PASSWORD:lumie}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        multiTenancy: SCHEMA

  flyway:
    enabled: true
    locations: classpath:db/migration/public
    baseline-on-migrate: true
    baseline-version: "0"

  data:
    redis:
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  mail:
    host: ${SMTP_HOST:smtp.mail.me.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
      file-size-threshold: 2MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Cloudflare Registrar (custom domain availability check)
cloudflare:
  registrar:
    enabled: ${CF_REGISTRAR_ENABLED:false}
    account-id: ${CF_ACCOUNT_ID:}
    api-token: ${CF_REGISTRAR_TOKEN:}

# JWT (auth module)
jwt:
  secret-key: ${JWT_SECRET_KEY:your-256-bit-secret-key-here-must-be-at-least-32-chars}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  issuer: lumie-auth-svc

# Cookie (auth module)
cookie:
  domain: ${COOKIE_DOMAIN:}
  secure: ${COOKIE_SECURE:true}
  http-only: true
  same-site: Lax
  path: /
  access-token-name: lumie_access_token
  refresh-token-name: lumie_refresh_token

# OAuth2 (auth module)
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://lumie-edu.com/api/auth/v1/oauth2/google/callback}
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    scope: openid email profile
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:https://lumie-edu.com/api/auth/v1/oauth2/kakao/callback}
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    scope: profile_nickname account_email
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:https://lumie-edu.com/api/auth/v1/oauth2/naver/callback}
    authorization-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    scope: name email
  frontend-callback-url: ${FRONTEND_CALLBACK_URL:https://lumie-edu.com/auth/callback}

# Paddle (billing module)
paddle:
  enabled: ${PADDLE_ENABLED:false}
  sandbox: ${PADDLE_SANDBOX:true}
  api-key: ${PADDLE_API_KEY:}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
  client-token: ${PADDLE_CLIENT_TOKEN:}

# MinIO (exam + file modules)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:lumie-files}

# Read-only datasource (ai module)
readonly-datasource:
  jdbc-url: jdbc:postgresql://${RO_DB_HOST:${DB_HOST:localhost}}:${RO_DB_PORT:${DB_PORT:5432}}/${RO_DB_NAME:${DB_NAME:lumie}}?prepareThreshold=0
  username: ${RO_DB_USERNAME:openclaw}
  password: ${RO_DB_PASSWORD:openclaw}
  driver-class-name: org.postgresql.Driver
  maximum-pool-size: 5
  minimum-idle: 2
  connection-timeout: 10000

# Gemini via Spring AI (OpenAI-compat endpoint)
# Spring AI appends completions-path to base-url. Default is /v1/chat/completions,
# but Gemini's OpenAI-compat endpoint expects /chat/completions (no /v1 prefix).
spring.ai:
  openai:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    chat:
      completions-path: /chat/completions
      options:
        model: gemini-2.5-flash
        temperature: 0.7
        maxTokens: 4096
  retry:
    max-attempts: 3
    backoff:
      initial-interval: 1000
      multiplier: 2
      max-interval: 5000

# Telegram Bot (ai module)
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

# External Python services (exam module)
lumie:
  services:
    grading:
      url: ${GRADING_SVC_URL:http://localhost:8001}
    report:
      url: ${REPORT_SVC_URL:http://localhost:8002}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    com.lumie: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

spring:
  application:
    name: lumie-backend

  jpa:
    # LazyConnectionDataSourceProxy (RoutingDataSourceConfig) returns a stub
    # DatabaseMetaData on getConnection() pre-first-statement, so Hibernate
    # cannot auto-detect the dialect at boot — pin it explicitly. This was
    # also the most likely (mis-attributed) root cause of the D.7 v1/v2
    # production crashes; the "jpaSharedEM_entityManagerFactory unresolved"
    # the reverters logged was the downstream symptom of EMF creation
    # failing here.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # JDBC batching — bulk inserts/updates go in 50-row batches
        # instead of one round-trip per row. Required for student bulk
        # import and OMR result writes to scale.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    # Migrations run as the table-owning role (DB_MIGRATOR_*), distinct from
    # the runtime HikariCP pool (DB_USERNAME/PASSWORD = lumie_app NOSUPERUSER).
    # Falls back to the runtime creds for local dev where one role suffices.
    user: ${DB_MIGRATOR_USERNAME:${DB_USERNAME:lumie}}
    password: ${DB_MIGRATOR_PASSWORD:${DB_PASSWORD:lumie}}
    # Phase 1 (2026-05-12 RLS cutover): keep scanning only the platform
    # public/ tree. The tenant/ tree still exists under db/migration/ but
    # is not loaded — versions there will collide (multiple V1, V2, V3
    # across module trees) and Phase 3 will physically merge them into
    # db/migration/ as a single chain with RLS policies. Until then,
    # leave the path narrow so boot doesn't fail.
    locations: classpath:db/migration/public
    baseline-on-migrate: true
    baseline-version: "0"
    # V21/V23 use CREATE INDEX CONCURRENTLY, which self-deadlocks against
    # Flyway's default transactional advisory lock (pg_advisory_xact_lock) on a
    # from-scratch migrate() — i.e. a fresh deploy / DR rebuild. Session-level
    # locking avoids it. Existing envs already migrated incrementally and are
    # unaffected; this protects new environments. Mirrored in
    # MigrationsRlsIntegrationTest so the test reproduces prod exactly.
    postgresql:
      transactional-lock: false

  # Spring Modulith outbox — JDBC store, public schema (cross-tenant).
  # schema-initialization disabled because Flyway owns the DDL (V13).
  # republish-outstanding-events-on-restart: incomplete events are retried on boot.
  # completion-mode=delete: row is removed once dispatched, not just stamped.
  # OMR/report batches publish up to 50 events each — UPDATE-mode would grow
  # event_publication unbounded with completed rows.
  modulith:
    events:
      jdbc:
        schema: public
        schema-initialization:
          enabled: false
      completion-mode: delete
      republish-outstanding-events-on-restart: true

  data:
    redis:
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        # Stable JSON shape for Page<T> responses:
        #   { content, page, size, totalElements, totalPages }
        # Spring's default PageImpl serialization is unstable across boot
        # versions ("PageImpl" warning since 3.3+); via-dto pins it.
        serialization-mode: via-dto

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
      file-size-threshold: 2MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Read/write split (D.7). Two HikariCP pools under app.datasource.* so
# DataSourceAutoConfiguration (which binds spring.datasource.url) backs
# off cleanly; RoutingDataSourceConfig wires the @Primary routing DS.
# @Transactional(readOnly=true) services route to the readonly pool;
# write tx + non-transactional code route to primary.
app:
  datasource:
    primary:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumie}?prepareThreshold=0
      username: ${DB_USERNAME:lumie}
      password: ${DB_PASSWORD:lumie}
      driver-class-name: org.postgresql.Driver
      hikari:
        # Behind PgBouncer the app-side pool stays small — PgBouncer
        # multiplexes to Postgres. max-lifetime stays under PgBouncer's
        # server_lifetime (3600s) so Hikari retires before the pooler
        # closes underneath us.
        pool-name: PrimaryHikariPool
        maximum-pool-size: 8
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        keepalive-time: 30000
        max-lifetime: 1500000
        # Tags every physical connection so pg_stat_activity attributes
        # load to the pool and the routing test can verify which pool
        # served a given @Transactional method.
        connection-init-sql: "SET app.pool_id = 'primary'"
    readonly:
      # RO_DB_* env unset (dev/local, single-node dev CNPG) falls back to
      # primary host. Same lumie_app role (NOSUPERUSER NOBYPASSRLS) — RLS
      # binds on this pool too.
      url: jdbc:postgresql://${RO_DB_HOST:${DB_HOST:localhost}}:${RO_DB_PORT:${DB_PORT:5432}}/${RO_DB_NAME:${DB_NAME:lumie}}?prepareThreshold=0
      username: ${RO_DB_USERNAME:${DB_USERNAME:lumie}}
      password: ${RO_DB_PASSWORD:${DB_PASSWORD:lumie}}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: ReadOnlyHikariPool
        maximum-pool-size: 5
        minimum-idle: 2
        connection-timeout: 10000
        idle-timeout: 600000
        keepalive-time: 30000
        max-lifetime: 1500000
        read-only: true
        connection-init-sql: "SET app.pool_id = 'readonly'"

# JWT (auth module)
jwt:
  secret-key: ${JWT_SECRET_KEY:?JWT_SECRET_KEY env var required (Vault → VSO → K8s Secret)}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  issuer: lumie-auth-svc

# Cookie (auth module)
cookie:
  domain: ${COOKIE_DOMAIN:}
  secure: ${COOKIE_SECURE:true}
  http-only: true
  same-site: Lax
  path: /
  access-token-name: lumie_access_token
  refresh-token-name: lumie_refresh_token

# Paddle (billing module)
paddle:
  enabled: ${PADDLE_ENABLED:false}
  sandbox: ${PADDLE_SANDBOX:true}
  api-key: ${PADDLE_API_KEY:}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
  client-token: ${PADDLE_CLIENT_TOKEN:}

# MinIO (exam + file modules)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:lumie-files}

# Telegram Bot (ai module)
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

# External Python services (exam module) + CORS
lumie:
  services:
    grading:
      url: ${GRADING_SVC_URL:http://localhost:8001}
    report:
      url: ${REPORT_SVC_URL:http://localhost:8002}
    chatbot:
      url: ${CHATBOT_SVC_URL:http://localhost:18002}
  cors:
    allowed-origins:
      - https://lumie-edu.com
      - https://dev.lumie-edu.com
      - http://localhost:3000
  internal:
    hmac-secret: ${LUMIE_INTERNAL_HMAC_SECRET:?LUMIE_INTERNAL_HMAC_SECRET env var required (Vault → VSO → K8s Secret)}
  # Boot-time guard: refuses to start if the runtime DB role has SUPERUSER/BYPASSRLS (RLS leak risk).
  # Disable only in TestContainers-backed tests where the DB user is a superuser by default.
  security:
    runtime-role-guard:
      enabled: true

  # Per-IP token-bucket rate limits. Rules evaluated in order, first match wins.
  # Per-pod buckets — multi-pod cluster effective limit = capacity × pod count.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      - path-pattern: /v1/login
        capacity: 10
        window: 1m
      - path-pattern: /v1/register
        capacity: 5
        window: 1h
      - path-pattern: /v1/register/owner
        capacity: 5
        window: 1h
      - path-pattern: /v1/students/*/reset-password
        capacity: 10
        window: 1h
      - path-pattern: /v1/admins/*/reset-password
        capacity: 10
        window: 1h
      - path-pattern: /v1/students/bulk
        capacity: 30
        window: 1h
      - path-pattern: /v1/exams/*/results/omr/batch/confirm
        capacity: 60
        window: 1m
      - path-pattern: /v1/exams/*/reports/batch
        capacity: 30
        window: 1m
      - path-pattern: /v1/payments/confirm
        capacity: 30
        window: 1m

server:
  port: 8080
  shutdown: graceful

# springdoc — OpenAPI 3.0 spec at /v3/api-docs, Swagger UI at /swagger-ui.html.
# Disable in prod via SPRINGDOC_API_DOCS_ENABLED=false (the spec endpoint can
# leak controller surface; CI pulls it during build, prod traffic should not).
springdoc:
  # Pageable is flattened to page/size/sort by OpenApiPageableFlattenCustomizer
  # (not the global default-flat-param-object flag, which also mangles multipart
  # @RequestPart bodies — springdoc-openapi#2282).
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    com.lumie: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

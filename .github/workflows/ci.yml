name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: zot.lumie-infra.com
  IMAGE_NAME: applications/lumie-backend

jobs:
  test:
    name: Gradle check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
      JAVA_TOOL_OPTIONS: -Xmx1536m -XX:MaxRAMPercentage=75.0
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run checks
        run: |
          chmod +x ./gradlew
          ./gradlew check --no-configuration-cache --no-daemon --console=plain

      - name: Run changed-module integration and coverage gates
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${BEFORE:-}}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] ||
             ! git cat-file -e "${base}^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi
          ./gradlew :modules:ai:test :modules:assignment:test :modules:auth:test :modules:class:test :modules:content:test :modules:exam:test :modules:file:test :modules:lecture:test :modules:staff:test :modules:student:test -Pintegration --no-configuration-cache --no-daemon --console=plain
          ./gradlew jacocoTestCoverageVerification -Pintegration --no-configuration-cache --no-daemon --console=plain
          python3 scripts/lumie-lint/check-changed-coverage.py --base "$base" --allow-empty

      - name: Log in to Zot for integration fixtures
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Run full app integration tests
        run: ./gradlew :app:integrationTest --no-configuration-cache --no-daemon --console=plain

      - name: Verify boundary acceptance scenarios
        run: python3 scripts/lumie-lint/check-boundary-atdd.py

  build-push:
    name: Build and push ARM image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs:
      - test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::8}"
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "short_sha=${short_sha}"
            echo "image=${image}"
            echo "tags=${image}:${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Zot
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Update image tag values
        if: github.ref == 'refs/heads/main'
        env:
          TAG_REPO: Lumie-Edu/lumie-image-tags
          TAG_FILE: applications/lumie/backend/image-values.yaml
          IMAGE_TAG: ${{ steps.tags.outputs.short_sha }}
          TAG_REPO_TOKEN: ${{ secrets.LUMIE_GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_REPO_TOKEN}" ]; then
            echo "::error::LUMIE_GITOPS_TOKEN is required to update ${TAG_REPO}."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            workdir="$(mktemp -d)"
            git clone --depth=1 "https://x-access-token:${TAG_REPO_TOKEN}@github.com/${TAG_REPO}.git" "${workdir}"
            mkdir -p "${workdir}/$(dirname "${TAG_FILE}")"
            cat > "${workdir}/${TAG_FILE}" <<EOF
          common:
            image:
              tag: "${IMAGE_TAG}"
          EOF

            git -C "${workdir}" config user.name "Lumie CI"
            git -C "${workdir}" config user.email "ci@lumie-edu.com"
            git -C "${workdir}" add "${TAG_FILE}"
            if git -C "${workdir}" diff --cached --quiet; then
              rm -rf "${workdir}"
              exit 0
            fi
            git -C "${workdir}" commit -m "CI(images): update lumie-backend tag"
            if git -C "${workdir}" push; then
              rm -rf "${workdir}"
              exit 0
            fi
            rm -rf "${workdir}"
            sleep "$((attempt * 2))"
          done

          echo "::error::Failed to update ${TAG_FILE} after retries."
          exit 1

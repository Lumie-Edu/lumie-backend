name: Backend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: zot.lumie-infra.com
  IMAGE_NAME: applications/lumie-backend

jobs:
  test:
    name: Gradle check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
      JAVA_TOOL_OPTIONS: -Xmx1536m -XX:MaxRAMPercentage=75.0
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run checks
        run: |
          chmod +x ./gradlew
          ./gradlew check --no-daemon --console=plain

  build-push:
    name: Build and push ARM image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::8}"
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "short_sha=${short_sha}"
            echo "image=${image}"
            echo "tags=${image}:${short_sha},${image}:main"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Zot
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Update image tag values
        if: github.ref == 'refs/heads/main'
        env:
          TAG_REPO: Lumie-Edu/lumie-image-tags
          TAG_FILE: applications/lumie/backend/image-values.yaml
          IMAGE_TAG: ${{ steps.tags.outputs.short_sha }}
          TAG_REPO_TOKEN: ${{ secrets.IMAGE_TAGS_TOKEN || secrets.DOCS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_REPO_TOKEN}" ]; then
            echo "::error::IMAGE_TAGS_TOKEN or DOCS_GITHUB_TOKEN is required to update ${TAG_REPO}."
            exit 1
          fi

          workdir="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${TAG_REPO_TOKEN}@github.com/${TAG_REPO}.git" "${workdir}"
          mkdir -p "${workdir}/$(dirname "${TAG_FILE}")"
          cat > "${workdir}/${TAG_FILE}" <<EOF
          common:
            image:
              tag: "${IMAGE_TAG}"
          EOF

          cd "${workdir}"
          git config user.name "Lumie CI"
          git config user.email "ci@lumie-edu.com"
          git add "${TAG_FILE}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "CI(images): update lumie-backend tag"
          git push

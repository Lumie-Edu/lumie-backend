name: Generate Documentation

on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Specific module to generate (e.g., tenant-svc, exam-svc, app)'
        required: false
        type: string

concurrency:
  group: docs-gen-backend-${{ inputs.section || github.sha }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
      has-changes: ${{ steps.map.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Map changed files to doc sections
        id: map
        run: |
          COMMON_LIBS="libs/messaging/**,libs/common/**,libs/internal-api/**,app/**,settings.gradle.kts,build.gradle.kts,.github/**/*.yml"

          # Manual override
          if [ -n "${{ inputs.section }}" ]; then
            SVC="${{ inputs.section }}"
            case "$SVC" in
              tenant-svc)     INCLUDE="services/platform/tenant-svc/**,$COMMON_LIBS" ;;
              auth-svc)       INCLUDE="services/platform/auth-svc/**,$COMMON_LIBS" ;;
              billing-svc)    INCLUDE="services/platform/billing-svc/**,$COMMON_LIBS" ;;
              academy-svc)    INCLUDE="services/core/academy-svc/**,$COMMON_LIBS" ;;
              exam-svc)       INCLUDE="services/core/exam-svc/**,$COMMON_LIBS" ;;
              content-svc)    INCLUDE="services/core/content-svc/**,$COMMON_LIBS" ;;
              admin-svc)      INCLUDE="services/core/admin-svc/**,$COMMON_LIBS" ;;
              attendance-svc) INCLUDE="services/core/attendance-svc/**,$COMMON_LIBS" ;;
              ai-svc)         INCLUDE="services/core/ai-svc/**,$COMMON_LIBS" ;;
              file-svc)       INCLUDE="services/support/file-svc/**,$COMMON_LIBS" ;;
              app)            INCLUDE="app/**,$COMMON_LIBS" ;;
              *) echo "Unknown module: $SVC"; exit 1 ;;
            esac
            echo "matrix=[{\"section\":\"backend/$SVC\",\"include\":\"$INCLUDE\"}]" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SECTIONS=""
          add_section() {
            local svc="$1" path="$2"
            if [[ "$SECTIONS" != *"$svc"* ]]; then
              if [ -n "$SECTIONS" ]; then SECTIONS="$SECTIONS,"; fi
              SECTIONS="${SECTIONS}{\"section\":\"backend/$svc\",\"include\":\"$path,$COMMON_LIBS\"}"
            fi
          }

          LIBS_CHANGED=false
          while IFS= read -r file; do
            case "$file" in
              services/platform/tenant-svc/*)     add_section "tenant-svc" "services/platform/tenant-svc/**" ;;
              services/platform/auth-svc/*)       add_section "auth-svc" "services/platform/auth-svc/**" ;;
              services/platform/billing-svc/*)    add_section "billing-svc" "services/platform/billing-svc/**" ;;
              services/core/academy-svc/*)        add_section "academy-svc" "services/core/academy-svc/**" ;;
              services/core/exam-svc/*)           add_section "exam-svc" "services/core/exam-svc/**" ;;
              services/core/content-svc/*)        add_section "content-svc" "services/core/content-svc/**" ;;
              services/core/admin-svc/*)          add_section "admin-svc" "services/core/admin-svc/**" ;;
              services/core/attendance-svc/*)     add_section "attendance-svc" "services/core/attendance-svc/**" ;;
              services/core/ai-svc/*)             add_section "ai-svc" "services/core/ai-svc/**" ;;
              services/support/file-svc/*)        add_section "file-svc" "services/support/file-svc/**" ;;
              app/*)                              add_section "app" "app/**" ;;
              libs/*)
                LIBS_CHANGED=true
                ;;
              build.gradle.kts|settings.gradle.kts)
                LIBS_CHANGED=true
                ;;
            esac
          done <<< "$CHANGED"

          # If only libs changed, regenerate all modules
          if [ "$LIBS_CHANGED" = true ] && [ -z "$SECTIONS" ]; then
            add_section "tenant-svc" "services/platform/tenant-svc/**"
            add_section "auth-svc" "services/platform/auth-svc/**"
            add_section "billing-svc" "services/platform/billing-svc/**"
            add_section "academy-svc" "services/core/academy-svc/**"
            add_section "exam-svc" "services/core/exam-svc/**"
            add_section "content-svc" "services/core/content-svc/**"
            add_section "admin-svc" "services/core/admin-svc/**"
            add_section "attendance-svc" "services/core/attendance-svc/**"
            add_section "ai-svc" "services/core/ai-svc/**"
            add_section "file-svc" "services/support/file-svc/**"
            add_section "app" "app/**"
          fi

          if [ -z "$SECTIONS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matrix=[$SECTIONS]" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Sections: [$SECTIONS]"

  generate-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      max-parallel: 3
    uses: Lumie-Edu/lumie-document/.github/workflows/generate-docs-reusable.yml@main
    with:
      source-repo: lumie-backend
      docs-section: ${{ matrix.section }}
      repomix-include: ${{ matrix.include }}
      repomix-ignore: '**/build/**,**/test/**,**/*.class,**/bin/**,**/.gradle/**'
      docs-output-dir: backend
    secrets:
      gemini-api-key: ${{ secrets.GOOGLE_API_KEY }}
      docs-github-token: ${{ secrets.DOCS_GITHUB_TOKEN }}

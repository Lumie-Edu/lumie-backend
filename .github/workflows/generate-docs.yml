name: Generate Documentation

on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Specific module to generate (e.g., tenant, exam, app, architecture)'
        required: false
        type: string

concurrency:
  group: docs-gen-backend-${{ inputs.section || github.sha }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
      has-changes: ${{ steps.map.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Map changed files to doc sections
        id: map
        run: |
          COMMON_LIBS="libs/messaging/**,libs/common/**,libs/internal-api/**,app/**,settings.gradle.kts,build.gradle.kts,.github/**/*.yml"

          # Manual override
          if [ -n "${{ inputs.section }}" ]; then
            MOD="${{ inputs.section }}"
            case "$MOD" in
              tenant|auth|billing|homepage|exam|content|admin|attendance|ai|student|class|lecture|assignment|activity-log|notification|file)
                INCLUDE="modules/$MOD/**,$COMMON_LIBS" ;;
              app)          INCLUDE="app/**,$COMMON_LIBS" ;;
              architecture) INCLUDE="app/**,modules/**,$COMMON_LIBS" ;;
              *) echo "Unknown module: $MOD"; exit 1 ;;
            esac
            echo "matrix=[{\"section\":\"backend/$MOD\",\"include\":\"$INCLUDE\"}]" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SECTIONS=""
          add_section() {
            local mod="$1"
            if [[ "$SECTIONS" != *"\"backend/$mod\""* ]]; then
              if [ -n "$SECTIONS" ]; then SECTIONS="$SECTIONS,"; fi
              SECTIONS="${SECTIONS}{\"section\":\"backend/$mod\",\"include\":\"modules/$mod/**,$COMMON_LIBS\"}"
            fi
          }

          LIBS_CHANGED=false
          while IFS= read -r file; do
            case "$file" in
              modules/tenant/*)        add_section "tenant" ;;
              modules/auth/*)          add_section "auth" ;;
              modules/billing/*)       add_section "billing" ;;
              modules/homepage/*)      add_section "homepage" ;;
              modules/exam/*)          add_section "exam" ;;
              modules/content/*)       add_section "content" ;;
              modules/admin/*)         add_section "admin" ;;
              modules/attendance/*)    add_section "attendance" ;;
              modules/ai/*)            add_section "ai" ;;
              modules/student/*)       add_section "student" ;;
              modules/class/*)         add_section "class" ;;
              modules/lecture/*)       add_section "lecture" ;;
              modules/assignment/*)    add_section "assignment" ;;
              modules/activity-log/*)  add_section "activity-log" ;;
              modules/notification/*)  add_section "notification" ;;
              modules/file/*)          add_section "file" ;;
              app/*)
                if [[ "$SECTIONS" != *"\"backend/app\""* ]]; then
                  if [ -n "$SECTIONS" ]; then SECTIONS="$SECTIONS,"; fi
                  SECTIONS="${SECTIONS}{\"section\":\"backend/app\",\"include\":\"app/**\"}"
                fi
                ;;
              libs/*|build.gradle.kts|settings.gradle.kts)
                LIBS_CHANGED=true
                ;;
            esac
          done <<< "$CHANGED"

          # If only libs changed, regenerate all modules
          if [ "$LIBS_CHANGED" = true ] && [ -z "$SECTIONS" ]; then
            for mod in tenant auth billing homepage exam content admin attendance ai student class lecture assignment activity-log notification file; do
              add_section "$mod"
            done
            if [[ "$SECTIONS" != *"\"backend/app\""* ]]; then
              SECTIONS="${SECTIONS},{\"section\":\"backend/app\",\"include\":\"app/**\"}"
            fi
          fi

          if [ -z "$SECTIONS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matrix=[$SECTIONS]" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Sections: [$SECTIONS]"

  generate-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      max-parallel: 3
    uses: Lumie-Edu/lumie-document/.github/workflows/generate-docs-reusable.yml@main
    with:
      source-repo: lumie-backend
      docs-section: ${{ matrix.section }}
      repomix-include: ${{ matrix.include }}
      repomix-ignore: '**/build/**,**/test/**,**/*.class,**/bin/**,**/.gradle/**'
      docs-output-dir: backend
    secrets: inherit
